name: ci

on:
  push:
  pull_request:

jobs:
  governance-and-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify governance skeleton
        run: ./scripts/verify-governance.sh

      - name: Cargo test
        working-directory: rust
        run: cargo test --workspace