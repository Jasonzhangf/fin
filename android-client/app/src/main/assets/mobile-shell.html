<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>fin mobile</title>
  <style>
    :root{--bg:#f3f3f3;--card:#fff;--text:#111;--muted:#9a9a9a;--line:#e8e8e8}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;color:var(--text)}
    .app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
    .top{padding:18px 18px 6px;display:flex;justify-content:space-between;align-items:center}
    .round{width:56px;height:56px;border-radius:28px;border:none;background:#ececec;font-size:24px;color:#111}
    .content{flex:1;padding:10px 22px 80px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:16px;line-height:1.55}
    .turns{width:100%;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:left}
    .card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
    .pending{border:1px solid #ececf2}
    .you{font-weight:700;margin-bottom:6px}
    .assistant{white-space:pre-wrap}
    .status{margin-top:6px;font-size:12px;color:#777;display:flex;align-items:center;gap:6px}
    .dots{display:inline-flex;gap:3px}
    .dot{width:4px;height:4px;border-radius:50%;background:#999;animation:blink 1s infinite}
    .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
    @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
    .bar{position:sticky;bottom:0;padding:10px 14px 16px;background:linear-gradient(180deg,rgba(243,243,243,0),#f3f3f3 28%)}
    .input{min-height:62px;background:#fff;border-radius:31px;display:flex;align-items:flex-end;padding:8px 10px;gap:8px}
    .ico{width:42px;height:42px;border-radius:21px;border:none;background:transparent;font-size:28px;color:#111}
    .msg{flex:1;border:none;outline:none;font-size:18px;line-height:1.35;background:transparent;color:#555;resize:none;max-height:120px;padding:10px 4px 8px}
    .send{width:42px;height:42px;border:none;border-radius:21px;background:#5b3ed5;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
    .panel{position:fixed;inset:0;background:#f3f3f3;z-index:20;transform:translateX(105%);transition:transform .22s ease;padding:18px;overflow:auto}
    .panel.show{transform:translateX(0)}
    .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .back{width:40px;height:40px;border:none;border-radius:20px;background:#ececec}
    .title{font-size:22px;font-weight:700}
    .row{display:flex;gap:10px;align-items:center;margin:8px 0}
    .inp{flex:1;padding:12px;border:1px solid #e2e2e2;border-radius:10px;background:#fff}
    .btn{padding:10px 14px;border:none;border-radius:10px;background:#111;color:#fff}
    .item{background:#fff;border-radius:12px;padding:12px;margin:8px 0}
    .muted{font-size:12px;color:#8a8a8a}
    .timeline{margin-top:8px;border-top:1px dashed #e8e8e8;padding-top:8px}
    .tl-item{font-size:12px;color:#444;line-height:1.4;margin:4px 0}
    .tl-ok{color:#1f7a3e}.tl-fail{color:#b00020}
    .dbg-raw{margin-top:6px;background:#fafafa;border:1px solid #eee;border-radius:8px;padding:8px;white-space:pre-wrap;font-size:11px;color:#666}
    .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.05);opacity:0;pointer-events:none;transition:opacity .18s;z-index:28}
    .sheet-mask.show{opacity:1;pointer-events:auto}
    .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:14px 16px 22px;transform:translateY(110%);transition:transform .2s ease;z-index:30}
    .sheet.show{transform:translateY(0)}
    .grab{width:56px;height:6px;border-radius:3px;background:#ddd;margin:2px auto 10px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .tile{border:none;background:#f2f2f2;border-radius:12px;padding:14px 8px;font-size:16px}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px 2px}
    .chip{display:inline-flex;align-items:center;gap:6px;background:#f2f2f6;color:#333;padding:5px 8px;border-radius:12px;font-size:12px}
    .chip button{border:none;background:transparent;color:#666}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111;color:#fff;padding:8px 12px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .15s;z-index:50}
    .toast.show{opacity:1}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="round" onclick="openSettings()">☰</button>
    <button class="round" onclick="openSessions()">◌✓</button>
  </div>

  <div id="content" class="content">
    <div id="empty">此聊天不会出现在聊天历史记录中，也不会用于训练我们的模型。为了安全起见，我们最多会将此聊天的副本保留 30 天。</div>
    <div id="turns" class="turns" style="display:none"></div>
  </div>

  <div class="bar">
    <div id="chips" class="chips"></div>
    <div class="input">
      <button class="ico" onclick="pickPlus()">＋</button>
      <textarea id="msg" class="msg" placeholder="发消息或按住说话…" rows="1"></textarea>
      <button class="send" onclick="sendInput()">➤</button>
    </div>
  </div>
</div>

<div id="settingsPanel" class="panel">
  <div class="head"><button class="back" onclick="closePanel('settingsPanel')">‹</button><div class="title">设置</div></div>
  <div class="item">
    <div class="muted">Daemon 地址（持久化到配置文件）</div>
    <div class="row"><input id="daemonHost" class="inp" value="100.66.1.82"/></div>
    <div class="row"><input id="daemonPort" class="inp" value="4040"/></div>
    <div class="row"><button class="btn" onclick="saveDaemon()">保存</button><button class="btn" onclick="connectWs()">连接</button></div>
    <div class="muted" id="connState">state=idle</div>
  </div>
  <div class="item">
    <div class="muted">调试显示开关（仅影响渲染，不影响真实推理）</div>
    <div class="row"><button id="debugToggle" class="btn" onclick="toggleDebugMode()">调试：关</button></div>
    <div class="muted">默认关闭。打开后才显示原始调试 JSON。</div>
  </div>
</div>

<div id="sessionsPanel" class="panel">
  <div class="head"><button class="back" onclick="closePanel('sessionsPanel')">‹</button><div class="title">会话</div></div>
  <div id="sessionList"></div>
</div>

<div id="plusSheet" class="sheet">
  <div class="grab"></div>
  <div class="grid">
    <button class="tile" onclick="plusAction('camera')">📷<br/>拍照</button>
    <button class="tile" onclick="plusAction('album')">🖼️<br/>相册</button>
    <button class="tile" onclick="plusAction('skill')">📚<br/>技能</button>
  </div>
</div>
<div id="plusMask" class="sheet-mask" onclick="closePlusSheet()"></div>
<div id="toast" class="toast"></div>

<script>
const S={profiles:[],currentProfile:null,conn:'idle',ws:null,sessions:[],currentSessionId:null,turns:[],inputDedup:new Set(),pendingById:{},attachments:[],debugMode:false,retryCount:0,retryTimer:null,manualClose:false,historyLoaded:false}
function bridge(){return window.FinMobileBridge||null}
function esc(v){return (v??'').toString().replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function log(m){const b=bridge();if(b&&b.appendConnectionEvent){try{b.appendConnectionEvent(m)}catch(_){}}}
function openSettings(){document.getElementById('settingsPanel').classList.add('show')}
function openSessions(){renderSessions();document.getElementById('sessionsPanel').classList.add('show')}
function closePanel(id){document.getElementById(id).classList.remove('show')}
function renderChips(){const c=document.getElementById('chips');c.innerHTML=S.attachments.map((a,i)=>`<span class='chip'>${esc(a.label)}<button onclick='removeAttachment(${i})'>×</button></span>`).join('')}
function removeAttachment(i){S.attachments.splice(i,1);renderChips()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1200)}
function backoffMs(n){return Math.min(15000,Math.floor(600*Math.pow(2,Math.max(0,n-1))))}
function clearRetry(){if(S.retryTimer){clearTimeout(S.retryTimer);S.retryTimer=null}}
function scheduleReconnect(reason){
  if(S.manualClose)return;
  const p=S.profiles.find(x=>x.id===S.currentProfile);
  if(!p)return;
  if(['auth_failed','protocol_mismatch','stale_token','no_profile'].includes(S.conn))return;
  const wait=backoffMs(S.retryCount+1);
  S.retryCount+=1;
  setConn(`reconnecting(${S.retryCount})`);
  log(`reconnect_reason=${reason} wait_ms=${wait}`);
  clearRetry();
  S.retryTimer=setTimeout(()=>{connectWs('retry')},wait);
}
function toggleDebugMode(){
  S.debugMode=!S.debugMode;
  const btn=document.getElementById('debugToggle');
  btn.textContent=S.debugMode?'调试：开':'调试：关';
  toast(S.debugMode?'调试显示已开启':'调试显示已关闭');
  renderTurns();
}
function setConn(s){S.conn=s;document.getElementById('connState').textContent='state='+s;log('state='+s)}
function loadProfiles(){const b=bridge();if(!b)return;try{S.profiles=JSON.parse(b.getWsProfiles());S.currentProfile=S.currentProfile||S.profiles[0]?.id||null}catch(_){}}
function saveDaemon(){const host=document.getElementById('daemonHost').value.trim();const port=parseInt(document.getElementById('daemonPort').value||'4040',10);const b=bridge();if(b&&b.setDaemonAddress){b.setDaemonAddress(host,port);loadProfiles();S.currentProfile='daemon';log('daemon_saved='+host+':'+port)}}
function connectWs(trigger='manual'){
  const p=S.profiles.find(x=>x.id===S.currentProfile);if(!p){setConn('no_profile');return;}
  if(p.expiresAtEpochSec>0&&Math.floor(Date.now()/1000)>p.expiresAtEpochSec){setConn('stale_token');return;}
  S.manualClose=false;
  clearRetry();
  setConn(trigger==='retry'?'reconnecting':'connecting');
  log('endpoint='+p.endpoint);
  try{
    if(S.ws){try{S.ws.close()}catch(_){}} // explicit old socket close before new dial
    const ws=new WebSocket(p.endpoint);S.ws=ws;
    ws.onopen=()=>{S.retryCount=0;setConn('handshaking');ws.send(JSON.stringify({type:'mobile.handshake',token:p.token,project:p.project,scopes:['session.read','session.write','runtime.read']}));};
    ws.onmessage=(ev)=>{try{onWs(JSON.parse(ev.data))}catch(_){setConn('protocol_mismatch');toast('协议消息解析失败')}};
    ws.onerror=()=>{if(S.conn==='handshaking'){setConn('auth_failed');toast('连接握手失败')}else{setConn('endpoint_unreachable');scheduleReconnect('onerror')}};
    ws.onclose=()=>{if(S.manualClose){setConn('idle');return;}if(['auth_failed','protocol_mismatch','stale_token','no_profile'].includes(S.conn))return;setConn('closed');scheduleReconnect('onclose')};
  }catch(e){setConn('endpoint_unreachable');scheduleReconnect('exception')}
}
function onWs(m){
  if(m.type==='handshake.ok'){clearRetry();S.retryCount=0;log('handshake=ok');S.ws.send(JSON.stringify({type:'mobile.subscribe',topics:['session','runtime','project','daemon']}));setConn('subscribed');setConn('healthy');return;}
  if(m.type==='handshake.auth_failed'){clearRetry();setConn('auth_failed');toast('鉴权失败');return;}
  if(m.type==='handshake.protocol_mismatch'){clearRetry();setConn('protocol_mismatch');toast('协议不匹配');return;}
  if(m.type==='session.list'){S.sessions=m.sessions||[];if(!S.currentSessionId&&S.sessions.length>0){bindSession(S.sessions[0].session_id)}renderSessions();return;}
  if(m.type==='session.bound'){S.currentSessionId=m.session_id;renderSessions();return;}
  if(m.type==='session.history'){
    const rows=Array.isArray(m.turns)?m.turns:[];
    S.turns=rows.map(t=>({u:t.user_input||'',a:t.assistant_response||'',control:t.control_feedback_summary||'',tool:t.tool_execution_summary||'',closure:t.closure_stop_source||'',toolRecords:t.tool_execution_records||[],errors:t.error_records||[]}));
    S.historyLoaded=true;
    renderTurns();
    return;
  }
  if(m.type==='input.accepted'){
    const id=m.client_message_id||'';
    if(id&&S.pendingById[id]){
      S.pendingById[id].state='accepted';
      S.pendingById[id].serverPhase='queued';
    }
    renderTurns();return;
  }
  if(m.type==='turn.progress'){
    const id=m.client_message_id||'';
    if(id&&S.pendingById[id]){
      S.pendingById[id].state='waiting';
      S.pendingById[id].serverPhase=m.phase||'inference_waiting';
    }
    renderTurns();return;
  }
  if(m.type==='turn.rendered'){
    const id=m.client_message_id||'';
    if(id&&S.pendingById[id]) delete S.pendingById[id];
    S.turns.push({u:m.user_input||'',a:m.assistant_response||'',control:m.control_feedback_summary||'',tool:m.tool_execution_summary||'',closure:m.closure_stop_source||'',toolRecords:m.tool_execution_records||[],errors:m.error_records||[]});
    renderTurns();return;
  }
}
function renderSessions(){const el=document.getElementById('sessionList');el.innerHTML=S.sessions.map(s=>`<div class='item'><div><b>${esc(s.topic||s.session_id)}</b></div><div class='muted'>sid=${esc(s.session_id)} task=${esc(s.task_id||'-')} ${esc(s.phase||'')}</div><div class='row'><button class='btn' onclick="bindSession('${s.session_id}')">${S.currentSessionId===s.session_id?'已绑定':'绑定'}</button></div></div>`).join('')||"<div class='item muted'>暂无会话</div>"}
function bindSession(id){S.currentSessionId=id;if(S.ws)S.ws.send(JSON.stringify({type:'session.bind',session_id:id}));renderSessions()}
function renderToolTimeline(t){
  const rows=[];
  const records=t.toolRecords||[];
  const errors=t.errors||[];
  if(records.length===0 && errors.length===0)return '';
  for(const r of records){
    const name=r.tool_name||'tool';
    const st=r.status||'unknown';
    const err=(r.error_summary||'').trim();
    const cls=(st==='completed'&&!err)?'tl-ok':'tl-fail';
    rows.push(`<div class='tl-item ${cls}'>${esc(name)} · ${esc(st)}${err?` · ${esc(err)}`:''}</div>`);
  }
  if(rows.length===0 && errors.length>0){
    for(const e of errors){rows.push(`<div class='tl-item tl-fail'>${esc(e.tool_name||'tool')} · failed · ${esc(e.error_summary||'unknown')}</div>`)}
  }
  return `<div class='timeline'><div class='muted'>推理过程</div>${rows.join('')}</div>`;
}
function renderTurns(){
  const empty=document.getElementById('empty');
  const turns=document.getElementById('turns');
  const hasPending=Object.keys(S.pendingById).length>0;
  if(S.turns.length===0 && !hasPending){empty.style.display='block';turns.style.display='none';return;}
  empty.style.display='none';turns.style.display='flex';
  const renderedTurns=S.turns.slice().reverse().map(t=>{
    const timeline=renderToolTimeline(t);
    const debugRaw=S.debugMode?`<div class='dbg-raw'>${esc(JSON.stringify({control:t.control||'',tool:t.tool||'',closure:t.closure||'',toolRecords:t.toolRecords||[],errors:t.errors||[]},null,2))}</div>`:'';
    return `<div class='card'><div class='you'>你：${esc(t.u)}</div><div class='assistant'>${esc(t.a)}</div>${timeline}${debugRaw}</div>`;
  });
  const phaseMap={sending:'发送中',accepted:'已送达服务器',waiting:'等待推理结果',inference_waiting:'推理中',provider_wait:'等待模型响应',tool_wait:'工具执行中',queued:'排队中',running:'处理中'};
  const pending=Object.values(S.pendingById).sort((a,b)=>b.ts-a.ts).map(p=>{
    const phase=phaseMap[p.serverPhase]||phaseMap[p.state]||'处理中';
    return `<div class='card pending'><div class='you'>你：${esc(p.text)}</div><div class='status'>${esc(phase)} <span class='dots'><span class='dot'></span><span class='dot'></span><span class='dot'></span></span></div></div>`;
  });
  turns.innerHTML=[...pending,...renderedTurns].join('');
}
function sendInput(){const el=document.getElementById('msg');const txt=el.value.trim();if(!txt&&S.attachments.length===0){toast('请输入内容');return;}if(!(S.ws&&S.conn==='healthy')){toast('未连接');return;}if(!S.currentSessionId&&S.sessions.length>0)bindSession(S.sessions[0].session_id);if(!S.currentSessionId){toast('暂无可用会话');return;}const payload=(txt + (S.attachments.length?('\\n\\n附件:\\n'+S.attachments.map(a=>'- '+a.label).join('\\n')):'')).trim();const id='m-'+Date.now(),bucket=Math.floor(Date.now()/5000),key='mobile:'+id+':'+bucket;if(S.inputDedup.has(key)){toast('重复输入已忽略');return;}S.inputDedup.add(key);S.pendingById[id]={id,text:payload,state:'sending',serverPhase:'sending',ts:Date.now()};renderTurns();S.ws.send(JSON.stringify({type:'session.user_input',session_id:S.currentSessionId,payload,client_message_id:id,timestamp_bucket:bucket}));el.value='';S.attachments=[];renderChips();autosize()}
function closePlusSheet(){document.getElementById('plusSheet').classList.remove('show');document.getElementById('plusMask').classList.remove('show')}
function pickPlus(){document.getElementById('plusSheet').classList.add('show');document.getElementById('plusMask').classList.add('show')}
function plusAction(kind){closePlusSheet();const label=kind==='camera'?'图片(拍照)':kind==='album'?'图片(相册)':'技能卡片';S.attachments.push({kind,label});renderChips();toast(label+' 已添加');log('plus_'+kind)}
function autosize(){const el=document.getElementById('msg');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
document.getElementById('msg').addEventListener('input',autosize)
document.getElementById('msg').addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendInput()}})
autosize()
loadProfiles();renderTurns();if(S.profiles.length){if(!S.currentProfile)S.currentProfile=S.profiles[0].id; if(S.currentProfile==='daemon'||S.profiles.length===1)setTimeout(connectWs,250)}
</script>
</body>
</html>
