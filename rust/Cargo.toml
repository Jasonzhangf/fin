[workspace]
members = [
  "crates/config",
  "crates/provider",
  "crates/contracts",
  "crates/shared",
  "crates/runtime",
  "crates/orchestrator",
  "crates/registry",
  "crates/transport-http",
  "crates/harness-core",
  "crates/debug-server",
  "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
